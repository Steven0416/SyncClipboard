name: LAN-first validation

on:
  push:
    branches: [feat/lan-first-shortcuts]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lan-first-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  core-and-server:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302
      - name: Core regression and HTTP/SignalR integration
        run: dotnet test src/SyncClipboard.Test -c Release --filter "TestCategory!=PlatformWindows&TestCategory!=PlatformMacOS&TestCategory!=PlatformLinux" --logger "trx;LogFileName=lan-first.trx"
      - name: Build server
        run: dotnet build src/SyncClipboard.Server -c Release
      - name: Build standalone Bonjour discovery
        run: dotnet publish src/ClipBridge.Discovery -c Release -r win-x64 --self-contained true -o artifacts/clipbridge-discovery-win-x64
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lan-first-test-results
          path: src/SyncClipboard.Test/TestResults/*.trx
  windows-client:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - name: Build WinUI3 x64
        run: msbuild src\SyncClipboard.WinUI3\SyncClipboard.WinUI3.csproj /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:Configuration=Release /p:WindowsAppSDKSelfContained=true /p:SelfContained=true /v:m -restore
      - name: Validate Windows service graph
        run: dotnet test src/SyncClipboard.Test.WinUI3 -c Release -r win-x64 -p:Platform=x64 --logger "trx;LogFileName=winui-services.trx"
